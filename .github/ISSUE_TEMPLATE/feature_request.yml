name: Feature request
description: Propose a new command, a template, a source or a change in behaviour
title: "[feat]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Legal content (act templates, calculators, citation sources) mostly lives in
        [mcp-legal-it](https://github.com/capazme/mcp-legal-it/issues): if the request is
        about a source or a calculator, open it there and link it here.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do in Writer and what stops you today.
      placeholder: "When I draft an atto di citazione I have to compute the contributo unificato by hand because..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The proposal
      description: How LibreLex should behave. Mention the panel or button if you have one in mind.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Citations (extractor, verifier, sources)
        - Chat and research
        - Drafting (templates, generators, guided drafting)
        - Sidebar and Writer integration
        - Privacy, consent, providers
        - Install, build, platforms (Linux, Windows)
        - Docs
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: privacy
    attributes:
      label: Data check
      options:
        - label: This request contains no real client data.
          required: true
