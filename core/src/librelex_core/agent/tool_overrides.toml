# Concise descriptions for the model (spec §6.2). Keys are mcp-legal-it tool names.
[descriptions]
cite_law = "Testo ufficiale e vigente di una norma (Normattiva/EUR-Lex) da un riferimento breve, es. \"art. 2043 c.c.\", \"art. 13 GDPR\". Usalo SEMPRE prima di citare una norma; restituisce testo e URL della fonte."
fetch_act_index = "Indice (rubriche degli articoli) di un atto normativo da Normattiva, es. \"D.Lgs. 231/2001\": per orientarsi in un atto senza scaricarlo tutto."
fetch_full_act = "Testo integrale di un atto normativo da Normattiva. Lungo per i codici: preferisci cite_law per singoli articoli."
verifica_citazioni = "Verifica esistenza e metadati (numero, anno, sezione; comma) di un elenco di citazioni, una per riga: sentenze di Cassazione e norme. Non giudica il merito."
cerca_brocardi = "Annotazioni Brocardi su un articolo: ratio, spiegazione, massime con estremi di Cassazione (poi leggi_sentenza per il testo)."
cerca_giurisprudenza = "Ricerca full-text nelle sentenze di Cassazione (Italgiure, dal 2020). Usa 2-4 termini chiave e i filtri (sezione, anno_da, tipo_provvedimento), non riferimenti normativi completi; poi leggi_sentenza per il testo."
cerca_giurisprudenza_unificata = "Ricerca in parallelo su Cassazione, tributaria, TAR/CdS e CGUE con risultati per fonte: per temi trasversali."
leggi_sentenza = "Testo completo di una sentenza di Cassazione da numero e anno (es. 10787, 2024; sezione facoltativa), con massima e dispositivo."
giurisprudenza_su_norma = "Sentenze di Cassazione che citano un articolo dato (es. \"art. 2043 c.c.\"); solo riferimento, niente parole chiave."
orientamento_su_norma = "Mappa descrittiva degli orientamenti della Cassazione su un articolo: Sezioni Unite, cluster per sezione, segnali di contrasto. Nessuna previsione."
cerca_giurisprudenza_amministrativa = "Sentenze e provvedimenti di TAR e Consiglio di Stato (appalti, urbanistica, PA); poi leggi_provvedimento_amm con sede, nrg e nome_file del risultato."
leggi_provvedimento_amm = "Testo integrale di un provvedimento TAR/CdS a partire da sede, nrg e nome_file restituiti dalla ricerca."
cerca_giurisprudenza_cgue = "Sentenze della Corte di giustizia UE e del Tribunale UE per parole chiave, materia, anni; poi leggi_sentenza_cgue con il CELLAR URI."
leggi_sentenza_cgue = "Testo integrale di una sentenza CGUE dal CELLAR URI restituito dalla ricerca."
cerca_pronuncia_costituzionale = "Sentenze e ordinanze della Corte costituzionale per parole chiave; indica anno_da/anno_a (senza, solo l'anno corrente); poi leggi_pronuncia_costituzionale."
leggi_pronuncia_costituzionale = "Testo completo di una pronuncia della Corte costituzionale da numero e anno."
genera_modello_atto = "Modello strutturato di un atto giudiziario o stragiudiziale per categoria; poi lista_categorie_atti per i nomi."
lista_categorie_atti = "Elenco delle categorie di atti disponibili per genera_modello_atto."
interessi_legali = "Calcolo degli interessi legali su un capitale tra due date, con i tassi vigenti per periodo."
interessi_mora = "Calcolo degli interessi di mora (D.Lgs. 231/2002) su un capitale tra due date."
rivalutazione_monetaria = "Rivalutazione monetaria ISTAT di un importo tra due date."
contributo_unificato = "Contributo unificato dovuto per valore e tipo di causa."
parcella_avvocato_civile = "Parcella dell'avvocato nel civile (D.M. 55/2014) per valore e fasi."
termini_processuali_civili = "Termini processuali civili da una data, con sospensione feriale."
scadenza_processuale = "Data di scadenza di un termine processuale a partire da una data e da giorni/mesi."
calcolo_tempo_trascorso = "Tempo trascorso tra due date (anni, mesi, giorni)."
