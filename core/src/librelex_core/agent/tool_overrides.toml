# Concise descriptions for the model (spec §6.2). Keys are mcp-legal-it tool names.
[descriptions]
cite_law = "Testo ufficiale e vigente di una norma (Normattiva/EUR-Lex) da un riferimento breve, es. \"art. 2043 c.c.\", \"art. 13 GDPR\". Usalo SEMPRE prima di citare una norma; restituisce testo e URL della fonte."
fetch_act_index = "Indice (rubriche degli articoli) di un atto normativo da Normattiva, es. \"D.Lgs. 231/2001\": per orientarsi in un atto senza scaricarlo tutto."
fetch_full_act = "Testo integrale di un atto normativo da Normattiva. Lungo per i codici: preferisci cite_law per singoli articoli."
verifica_citazioni = "Verifica esistenza e metadati (numero, anno, sezione; comma) di un elenco di citazioni, una per riga: sentenze di Cassazione e norme. Non giudica il merito."
cerca_brocardi = "Annotazioni Brocardi su un articolo: ratio, spiegazione, massime con estremi di Cassazione (poi leggi_sentenza per il testo)."
cerca_giurisprudenza = "Ricerca full-text nelle sentenze di Cassazione (Italgiure, dal 2020). Usa 2-4 termini chiave e i filtri (sezione, anno_da, tipo_provvedimento), non riferimenti normativi completi; poi leggi_sentenza per il testo."
cerca_giurisprudenza_unificata = "Ricerca in parallelo su Cassazione, tributaria, TAR/CdS e CGUE con risultati per fonte: per temi trasversali."
leggi_sentenza = "Testo completo di una sentenza di Cassazione da numero e anno (es. 10787, 2024; sezione facoltativa), con massima e dispositivo."
giurisprudenza_su_norma = "Sentenze di Cassazione che citano un articolo dato (es. \"art. 2043 c.c.\"); solo riferimento, niente parole chiave."
orientamento_su_norma = "Mappa descrittiva degli orientamenti della Cassazione su un articolo: Sezioni Unite, cluster per sezione, segnali di contrasto. Nessuna previsione."
cerca_giurisprudenza_amministrativa = "Sentenze e provvedimenti di TAR e Consiglio di Stato (appalti, urbanistica, PA); poi leggi_provvedimento_amm con sede, nrg e nome_file del risultato."
leggi_provvedimento_amm = "Testo integrale di un provvedimento TAR/CdS a partire da sede, nrg e nome_file restituiti dalla ricerca."
cerca_giurisprudenza_cgue = "Sentenze della Corte di giustizia UE e del Tribunale UE per parole chiave, materia, anni; poi leggi_sentenza_cgue con il CELLAR URI."
leggi_sentenza_cgue = "Testo integrale di una sentenza CGUE dal CELLAR URI restituito dalla ricerca."
cerca_pronuncia_costituzionale = "Sentenze e ordinanze della Corte costituzionale per parole chiave; indica anno_da/anno_a (senza, solo l'anno corrente); poi leggi_pronuncia_costituzionale."
leggi_pronuncia_costituzionale = "Testo completo di una pronuncia della Corte costituzionale da numero e anno."
genera_modello_atto = "Modello strutturato di un atto giudiziario o stragiudiziale per categoria; poi lista_categorie_atti per i nomi."
lista_categorie_atti = "Elenco delle categorie di atti disponibili per genera_modello_atto."
decreto_ingiuntivo = "Bozza di ricorso per decreto ingiuntivo (creditore, debitore, importo, tipo_credito, provvisoria_esecuzione) con giudice competente e contributo unificato."
atto_di_precetto = "Bozza di atto di precetto ex art. 480 c.p.c. (creditore, debitore, titolo_esecutivo, importo_capitale, interessi, spese)."
sollecito_pagamento = "Bozza di lettera di sollecito di pagamento con interessi di mora (creditore, debitore, importo, data_scadenza, data_sollecito)."
procura_alle_liti = "Bozza di procura alle liti ex art. 83 c.p.c. (parte, avvocato, cf_avvocato, foro, oggetto_causa, tipo)."
relata_notifica_pec = "Bozza di relata di notificazione a mezzo PEC ex L. 53/1994 (avvocato, destinatario, pec_destinatario, atto_notificato, data_invio)."
attestazione_conformita = "Bozza di attestazione di conformità per il deposito telematico PCT (avvocato, tipo_documento, estremi_originale, modalita)."
sfratto_morosita = "Bozza di intimazione di sfratto per morosità con citazione per convalida (locatore, conduttore, immobile, canone_mensile, mensilita_insolute, data_contratto)."
nota_precisazione_credito = "Bozza di nota di precisazione del credito nell'esecuzione (creditore, debitore, procedura_esecutiva, capitale, interessi, spese_legali, spese_esecuzione)."
dichiarazione_553_cpc = "Bozza di dichiarazione del terzo pignorato ex art. 547 c.p.c. (terzo_pignorato, debitore, procedura, tipo_rapporto)."
genera_dpa = "Bozza di Data Processing Agreement ex art. 28 GDPR (titolare, responsabile, oggetto, durata, categorie_interessati, categorie_dati, misure_sicurezza, sub_responsabili)."
genera_dpia = "Bozza di valutazione d'impatto sulla protezione dei dati ex art. 35 GDPR (titolare, descrizione, finalita, necessita_proporzionalita, rischi, misure_mitigazione)."
genera_informativa_cookie = "Cookie policy con tabella cookie e testo del banner ex art. 122 Codice Privacy (titolare, sito_web, cookie_tecnici, cookie_analytics, cookie_profilazione)."
genera_informativa_dipendenti = "Informativa privacy per dipendenti ex art. 13 GDPR e Statuto dei Lavoratori (titolare, dpo, videosorveglianza, geolocalizzazione, strumenti_aziendali)."
genera_informativa_privacy = "Bozza di informativa privacy ex art. 13 o 14 GDPR (titolare, finalita, basi_giuridiche, categorie_dati, destinatari, periodo_conservazione, tipo: art13/art14)."
genera_informativa_videosorveglianza = "Informativa breve (cartello) ed estesa per sistemi di videosorveglianza ex art. 13 GDPR (titolare, finalita, tempo_conservazione, aree_riprese)."
genera_notifica_data_breach = "Modulo di notifica di una violazione dei dati al Garante entro 72 ore ex art. 33 GDPR (titolare, data_violazione, data_scoperta, descrizione, categorie_dati, n_interessati, conseguenze, misure_adottate, dpo)."
genera_registro_trattamenti = "Scheda di un trattamento per il Registro dei Trattamenti ex art. 30 GDPR (titolare, trattamento, finalita, base_giuridica, categorie_interessati, categorie_dati, destinatari, termine_cancellazione, misure_sicurezza)."
preventivo_civile = "Preventivo dei costi di una causa civile per valore e fasi (D.M. 55/2014, contributo unificato)."
preventivo_stragiudiziale = "Preventivo per attività stragiudiziale, diffida o trattativa, per valore_pratica e livello, con spese generali, CPA e IVA (D.M. 55/2014)."
preventivo_volontaria_giurisdizione = "Preventivo per procedimenti di volontaria giurisdizione (interdizioni, tutele, amministrazioni di sostegno) per valore_causa, fasi e livello (D.M. 55/2014, Tab. 7)."
interessi_legali = "Calcolo degli interessi legali su un capitale tra due date, con i tassi vigenti per periodo."
interessi_mora = "Calcolo degli interessi di mora (D.Lgs. 231/2002) su un capitale tra due date."
rivalutazione_monetaria = "Rivalutazione monetaria ISTAT di un importo tra due date."
contributo_unificato = "Contributo unificato dovuto per valore e tipo di causa."
parcella_avvocato_civile = "Parcella dell'avvocato nel civile (D.M. 55/2014) per valore e fasi."
termini_processuali_civili = "Termini processuali civili da una data, con sospensione feriale."
scadenza_processuale = "Data di scadenza di un termine processuale a partire da una data e da giorni/mesi."
calcolo_tempo_trascorso = "Tempo trascorso tra due date (anni, mesi, giorni)."
calcolo_hash = "Impronta hash SHA-256 di un testo, per il deposito telematico PCT (DM 44/2011)."
calcolo_valore_catastale = "Valore catastale rivalutato di un immobile per successione, compravendita o IMU (rendita_catastale, categoria, tipo, prima_casa)."
compenso_ctu = "Compenso indicativo del CTU nominato dal giudice (tipo_incarico, valore_causa, ore_lavoro)."
conta_giorni = "Conta i giorni di calendario, lavorativi o festivi tra due date (data_inizio, data_fine, tipo), con le festività italiane."
pignoramento_stipendio = "Quote pignorabili dello stipendio o della pensione ex art. 545 c.p.c. (stipendio_netto_mensile, tipo_credito: ordinario, alimentare, fiscale, concorso_crediti)."
scadenze_impugnazioni = "Termini di impugnazione di una sentenza civile, breve e lungo (data_pubblicazione, tipo_impugnazione, notificata), artt. 325-327 c.p.c."
spese_mediazione = "Indennità di mediazione civile e commerciale per scaglione di valore ed esito (valore_controversia, esito), DM 150/2023."
valutazione_data_breach = "Valutazione di un data breach e degli obblighi di notifica al Garante e comunicazione agli interessati (tipo_violazione, categorie_dati, n_interessati, dati_particolari, misure_protezione, impatto)."
variazioni_istat = "Tabella delle variazioni percentuali annuali dell'indice ISTAT FOI tra due anni (anno_inizio, anno_fine)."
